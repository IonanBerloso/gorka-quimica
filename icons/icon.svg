<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d2238"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="flask" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b6ee8"/>
      <stop offset="100%" stop-color="#b47fff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Erlenmeyer flask -->
  <g transform="translate(256 256)">
    <path d="M -50 -120 L -50 -50 L -110 80 Q -110 130 -60 130 L 60 130 Q 110 130 110 80 L 50 -50 L 50 -120 Z"
          fill="none" stroke="url(#flask)" stroke-width="14" stroke-linejoin="round"/>
    <!-- Liquid -->
    <path d="M -90 30 L 90 30 L 105 75 Q 105 120 60 120 L -60 120 Q -105 120 -105 75 Z"
          fill="url(#flask)" opacity="0.55"/>
    <!-- Bubbles -->
    <circle cx="-30" cy="60" r="10" fill="#67e8f9" opacity="0.85"/>
    <circle cx="20" cy="80" r="7" fill="#67e8f9" opacity="0.7"/>
    <circle cx="50" cy="50" r="5" fill="#67e8f9" opacity="0.6"/>
    <!-- Neck cap -->
    <rect x="-55" y="-130" width="110" height="14" rx="3" fill="url(#flask)"/>
  </g>
  <!-- Q letter -->
  <text x="256" y="430" text-anchor="middle"
        font-family="Space Grotesk, sans-serif" font-weight="700"
        font-size="62" fill="#b47fff" letter-spacing="6">QUÍMICA</text>
</svg>
